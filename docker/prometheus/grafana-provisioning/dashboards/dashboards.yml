# Grafana dashboard provisioning — auto-loads Prometheus dashboards.
apiVersion: 1

providers:
  - name: PowerScale Data Insights
    orgId: 1
    folder: PowerScale
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
