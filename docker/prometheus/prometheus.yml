# prometheus.yml — Prometheus scrape configuration for PowerScale Data Insights
#
# Scrapes gostats, goppstats, and goquotas Prometheus endpoints.
# Each cluster has its own port on the collector container.
# Add additional targets as you add clusters to the collector configs.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # gostats — one target per cluster (port = prometheus_port from config)
  - job_name: gostats
    static_configs:
      - targets:
          - gostats:9090
          # Add more targets for additional clusters:
          # - gostats:9091
          # - gostats:9092
          # - gostats:9093

  # goppstats — one target per cluster (port = prometheus_port from config)
  - job_name: goppstats
    static_configs:
      - targets:
          - goppstats:9090
          # Add more targets for additional clusters:
          # - goppstats:9091
          # - goppstats:9092
          # - goppstats:9093

  # goquotas — one target per cluster (port = prometheus_port from config)
  - job_name: goquotas
    static_configs:
      - targets:
          - goquotas:9190
          # Add more targets for additional clusters:
          # - goquotas:9191
          # - goquotas:9192
